[behave]
# Behave configuration for Vhape BDD tests

# Step definitions location
# Behave looks for steps in features/steps by default
# steps_dir = features/steps  # This is the default, so we can omit it

# Features location
paths = features

# Output format
format = pretty

# Stop on first failure
stop = False

# Verbose output
verbose = True

# Show skipped scenarios
show_skipped = True

# Environment variables
# VHAPE_API_URL can be set to override the default API base URL
# Default: http://localhost:8000

